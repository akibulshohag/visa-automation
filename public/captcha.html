<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mass Manual Captcha</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=turnstileLoaded" async defer></script>
  <style>
    body { font-family: sans-serif; background: #0f1117; color: #fff; margin: 20px; }
    .grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .widget-container { background: #1a1d2e; padding: 10px; border-radius: 8px; border: 1px solid #2e3250; }
    button { padding: 8px 16px; background: #6366f1; color: white; border: none; border-radius: 4px; cursor: pointer; }
    input { padding: 8px; border-radius: 4px; border: none; background: #242740; color: white; }
  </style>
</head>
<body>
  <h1>Mass Captcha Solver</h1>
  <div style="margin-top:10px;">
    <input type="number" id="numCaptchas" value="10" min="1" max="200" title="Number of widgets">
    <label style="margin-left:8px; font-size:13px;">Auto-refresh every
      <input type="number" id="refreshSecs" value="45" min="10" max="280" style="width:60px;" title="Seconds before a solved widget auto-resets for a fresh token">s
    </label>
    <label style="margin-left:8px; font-size:13px;">
      <input type="checkbox" id="autoRefresh" checked> on
    </label>
    <button onclick="loadCaptchas()">Load Captchas</button>
    <button onclick="resetAllWidgets()" style="background:#ef4444;" title="Reset every widget so they can be solved again">🔄 Reset All</button>
  </div>

  <div id="status" style="margin-top:10px; color:#38bdf8; font-size:14px;">⏳ Waiting for Cloudflare script to load via Proxy...</div>

  <div class="grid" id="grid"></div>

  <script>
    const socket = io();
    const siteKey = '0x4AAAAAACghKkJHL1t7UkuZ';
    const loadedWidgets = {};
    const refreshTimers = {}; // cfId -> setTimeout handle for auto-refresh

    function getRefreshMs() {
      const secs = parseInt(document.getElementById('refreshSecs').value) || 45;
      return Math.max(10, Math.min(280, secs)) * 1000;
    }

    // (Re)arm the auto-refresh timer for a widget. Called ONLY from the solve callback,
    // so the 45s countdown starts after a successful solve — never on an unsolved widget.
    function armRefresh(cfId) {
      if (refreshTimers[cfId]) clearTimeout(refreshTimers[cfId]);
      if (!document.getElementById('autoRefresh').checked) return;
      refreshTimers[cfId] = setTimeout(() => {
        refreshTimers[cfId] = null;
        // Guard: only refresh if this widget is STILL solved. If its token was already
        // consumed/reset and it's mid-verification again, leave it alone — don't interrupt
        // an unsolved widget. The next solve will re-arm a fresh 45s countdown.
        const domId = loadedWidgets[cfId];
        const el = domId && document.getElementById(domId);
        if (el && el.getAttribute('data-solved') === '1') {
          resetWidget(cfId); // re-render -> Turnstile re-solves -> callback re-arms timer
        }
      }, getRefreshMs());
    }

    function turnstileLoaded() {
      document.getElementById('status').innerText = '✅ Turnstile loaded! You can now click Load Captchas.';
    }

    async function loadCaptchas() {
      if (typeof turnstile === 'undefined') {
          document.getElementById('status').innerText = '❌ Error: Turnstile script is not loaded! The proxy might be offline or blocking it.';
          return;
      }

      const num = parseInt(document.getElementById('numCaptchas').value);
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      document.getElementById('status').innerText = `Loading ${num} widgets in batches...`;

      const batchSize = 5; // render 5 at a time

      for(let i=0; i<num; i++) {
        const domId = 'cf-widget-' + i;
        const div = document.createElement('div');
        div.className = 'widget-container';
        div.innerHTML = `<div id="${domId}"></div>`;
        grid.appendChild(div);

        try {
            const cfId = turnstile.render('#' + domId, {
            sitekey: siteKey,
            callback: function(token) {
                socket.emit('manual_captcha_solved', { widgetId: cfId, token: token });
                // Mark this widget solved so the auto-clicker stops clicking it (until reset).
                const el = document.getElementById(domId);
                if (el) el.setAttribute('data-solved', '1');
                // Schedule an auto-refresh so this token never goes stale in the pool.
                armRefresh(cfId);
                document.getElementById('status').innerText = '✅ Solved captcha and sent to global pool.';
            }
            });
            loadedWidgets[cfId] = domId; // map Turnstile widget ID -> our container div id

            // Per-widget reset button — re-renders this captcha if it errors or gets stuck.
            const resetBtn = document.createElement('button');
            resetBtn.textContent = '🔄 Reset';
            resetBtn.style.cssText = 'margin-top:8px; padding:4px 10px; font-size:12px; background:#ef4444;';
            resetBtn.onclick = () => resetWidget(cfId);
            div.appendChild(resetBtn);
        } catch(e) {
            console.error('Turnstile render error', e);
        }

        // Stagger rendering to prevent CPU freeze and Cloudflare rate limits
        if ((i + 1) % batchSize === 0) {
            await new Promise(resolve => setTimeout(resolve, 800));
        }
      }
      document.getElementById('status').innerText = `✅ All ${num} widgets loaded!`;
    }

    // Reset a single widget: Turnstile re-renders a fresh challenge and we clear the
    // solved flag so the auto-clicker (and you) can solve it again.
    function resetWidget(cfId) {
      if (!loadedWidgets[cfId]) return false;
      try {
        if (refreshTimers[cfId]) { clearTimeout(refreshTimers[cfId]); refreshTimers[cfId] = null; }
        turnstile.reset(cfId);
        const el = document.getElementById(loadedWidgets[cfId]);
        if (el) el.removeAttribute('data-solved');
        return true;
      } catch (e) {
        console.error('Reset error', e);
        return false;
      }
    }

    function resetAllWidgets() {
      const ids = Object.keys(loadedWidgets);
      if (!ids.length) {
        document.getElementById('status').innerText = '⚠️ No widgets loaded to reset.';
        return;
      }
      let n = 0;
      ids.forEach(cfId => { if (resetWidget(cfId)) n++; });
      document.getElementById('status').innerText = `🔄 Reset ${n} captcha widget(s).`;
    }

    socket.on('reset_captcha_widget', ({ widgetId }) => {
      if (resetWidget(widgetId)) {
        document.getElementById('status').innerText = 'Widget reset by backend.';
      }
    });
  </script>
</body>
</html>
